services:
  web:
    image: nginx:latest
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
      - 8080:8080
    networks:
      - app-network
    depends_on:
      - php
      - php_test
      
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - profile_data:/var/lib/mylink/profile
    environment:
      PROFILE_STORAGE_PATH: /var/lib/mylink/profile
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: "$DB_DATABASE"
      POSTGRES_USER: "$DB_USERNAME"
      POSTGRES_PASSWORD: "$DB_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - app-network

  selenium:
    image: selenium/standalone-chrome-debug:latest
    ports:
      - 4444:4444
      - 5900:5900
    networks:
      - app-network

  php_test:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - profile_test_data:/var/lib/mylink/profile-testing
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      selenium:
        condition: service_started
    environment:
      APP_ENV: testing
      PROFILE_TEST_STORAGE_PATH: /var/lib/mylink/profile-testing
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: encurtador_test
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
  profile_data:
  profile_test_data:
